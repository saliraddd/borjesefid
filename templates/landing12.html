{% load static %}
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>برج سفید - سفر رویایی شما</title>
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="{% static 'css/landing.css' %}">
</head>
<body>
    <!-- نوار هدر بالا -->
    <header class="top-header">
        <div class="header-left">
            <button class="hamburger-btn" onclick="toggleMenu()" id="hamburger">
                <i class="fas fa-bars" id="menu-icon"></i>
            </button>
        </div>

        <div class="header-center">
            <div class="logo">
                <img src="{% static 'images/logo4.png' %}" alt="معین گردشگری">
            </div>
        </div>

        <div class="header-right">
            <a href="#" class="support-link">
                <i class="fas fa-headset"></i>
                <span>پشتیبانی آنلاین</span>
            </a>
        </div>
    </header>

    <!-- منوی شیشه‌ای از چپ -->
    <div class="side-menu" id="side-menu">
        <div class="menu-header">
            <button class="close-menu" onclick="toggleMenu()">×</button>
            <span class="close-text">بستن</span>
        </div>
        <div class="menu-content">
            <a href="{% url 'accounts:login' %}" class="menu-item">
                <i class="fas fa-sign-in-alt"></i> ورود به حساب کاربری
            </a>
            <a href="/blog/" class="menu-item">
                <i class="fas fa-blog"></i> وبلاگ گردشگری
            </a>
            <a href="/about/" class="menu-item">
                <i class="fas fa-info-circle"></i> درباره ما
            </a>
            <a href="/contact/" class="menu-item">
                <i class="fas fa-phone-alt"></i> تماس با ما
            </a>
        </div>
    </div>

    <!-- پس‌زمینه تیره برای منو و فرم‌ها -->
    <div class="backdrop" id="backdrop"></div>

    <div class="sections-container">
        <!-- بخش پرواز -->
        <div class="section" onclick="openSearchModal('flight')">
            <video autoplay muted loop playsinline preload="auto">
                <source src="{% static 'videos/banner7.mp4' %}" type="video/mp4">
            </video>
            <div class="overlay"></div>
            <div class="section-content">
                <div class="section-title">پرواز</div>
            </div>
        </div>

        <!-- بخش هتل -->
        <div class="section" onclick="openSearchModal('hotel')">
            <video autoplay muted loop playsinline preload="auto">
                <source src="{% static 'videos/banner2.mp4' %}" type="video/mp4">
            </video>
            <div class="overlay"></div>
            <div class="section-content">
                <div class="section-title">هتل</div>
            </div>
        </div>

        <!-- بخش تور -->
        <div class="section" onclick="openSearchModal('tour')">
            <video autoplay muted loop playsinline preload="auto">
                <source src="{% static 'videos/dubai.mp4' %}" type="video/mp4">
            </video>
            <div class="overlay"></div>
            <div class="section-content">
                <div class="section-title">تور</div>
            </div>
        </div>
    </div>

    <!-- فرم پرواز -->
    <div class="search-modal" id="flight-modal">
        <button class="close-btn" onclick="closeSearchModal('flight')">×</button>
        <h2>جستجوی پرواز</h2>
        <form class="search-form" method="GET" action="{% url 'flights:flights_list' %}">
            <div class="form-row">
                <div class="form-group">
                    <label>مبدأ</label>
                    <div class="city-dropdown-container">
                        <input type="text" id="origin-input" placeholder="مثلاً تهران (THR)" autocomplete="off" required>
                        <input type="hidden" name="origin" id="origin-iata" required>
                        <div class="city-dropdown-list" id="origin-list"></div>
                    </div>
                </div>

                <div class="form-group">
                    <label>مقصد</label>
                    <div class="city-dropdown-container">
                        <input type="text" id="destination-input" placeholder="مثلاً مشهد (MHD)" autocomplete="off" required>
                        <input type="hidden" name="destination" id="destination-iata" required>
                        <div class="city-dropdown-list" id="destination-list"></div>
                    </div>
                </div>

                <div class="form-group">
                    <label>تاریخ رفت</label>
                    <input type="date" name="departure_date" required>
                </div>

                <div class="form-group">
                    <label>تعداد مسافران</label>
                    <input type="number" name="total_passengers" min="1" value="1">
                </div>
            </div>
            <button type="submit" class="search-btn">جستجوی پرواز</button>
        </form>
    </div>

    <!-- فرم هتل -->
    <div class="search-modal" id="hotel-modal">
        <button class="close-btn" onclick="closeSearchModal('hotel')">×</button>
        <h2>جستجوی هتل</h2>
        <form class="search-form" method="GET" action="/hotels/search/"> <!-- بعداً تغییر بده -->
            <div class="form-row">
                <div class="form-group">
                    <label>شهر مقصد</label>
                    <div class="city-dropdown-container">
                        <input type="text" id="hotel-city-input" placeholder="مثلاً کیش، دبی، تهران" autocomplete="off" required>
                        <input type="hidden" name="city" id="hotel-city-iata" required>
                        <div class="city-dropdown-list" id="hotel-city-list"></div>
                    </div>
                </div>

                <div class="form-group">
                    <label>تاریخ ورود</label>
                    <input type="date" name="check_in" required>
                </div>

                <div class="form-group">
                    <label>تاریخ خروج</label>
                    <input type="date" name="check_out" required>
                </div>

                <div class="form-group">
                    <label>تعداد نفرات</label>
                    <input type="number" name="guests" min="1" value="2">
                </div>
            </div>
            <button type="submit" class="search-btn">جستجوی هتل</button>
        </form>
    </div>

    <!-- فرم تور -->
    <div class="search-modal" id="tour-modal">
        <button class="close-btn" onclick="closeSearchModal('tour')">×</button>
        <h2>جستجوی تور</h2>
        <form class="search-form" method="GET" action="{% url 'tours:tour_list' %}">
            <div class="form-row">
                <div class="form-group">
                    <label>شهر مبدا</label>
                    <div class="city-dropdown-container">
                        <input type="text" id="tour-origin-input" placeholder="مثلاً تهران" autocomplete="off" required>
                        <input type="hidden" name="origin" id="tour-origin-iata" required>
                        <div class="city-dropdown-list" id="tour-origin-list"></div>
                    </div>
                </div>

                <div class="form-group">
                    <label>شهر مقصد</label>
                    <div class="city-dropdown-container">
                        <input type="text" id="tour-destination-input" placeholder="مثلاً مشهد" autocomplete="off" required>
                        <input type="hidden" name="destination" id="tour-destination-iata" required>
                        <div class="city-dropdown-list" id="tour-destination-list"></div>
                    </div>
                </div>

                <div class="form-group">
                    <label>تاریخ تقریبی</label>
                    <input type="date" name="departure_date">
                </div>

                <div class="form-group">
                    <label>تعداد نفرات</label>
                    <input type="number" name="guests" min="1" value="1">
                </div>
            </div>
            <button type="submit" class="search-btn">جستجوی تور</button>
        </form>
    </div>

    
    <script>
        // تابع مشترک برای همه دراپ‌داون‌های شهر
        function initCityDropdown(inputId, listId, hiddenId) {
            const input = document.getElementById(inputId);
            const list = document.getElementById(listId);
            const hidden = document.getElementById(hiddenId);

            if (!input || !list || !hidden) {
                console.error('عناصر دراپ‌داون پیدا نشدند:', inputId, listId, hiddenId);
                return;
            }

            // وقتی فیلد فوکوس می‌شه یا تایپ می‌کنه
            input.addEventListener('focus', () => fetchCities(''));
            input.addEventListener('input', () => fetchCities(input.value.trim()));

            // بستن لیست وقتی خارج از آن کلیک می‌شه
            document.addEventListener('click', (e) => {
                if (!input.contains(e.target) && !list.contains(e.target)) {
                    list.innerHTML = '';
                    list.classList.remove('show');
                }
            });

            async function fetchCities(query) {
                try {
                    const url = `/city-search/?q=${encodeURIComponent(query)}`;
                    console.log('درخواست به:', url); // برای دیباگ

                    const response = await fetch(url);
                    if (!response.ok) {
                        throw new Error('پاسخ ناموفق از سرور');
                    }

                    const data = await response.json();
                    console.log('داده‌های شهرها:', data); // برای دیباگ

                    list.innerHTML = '';
                    list.classList.add('show');

                    if (!data.cities || data.cities.length === 0) {
                        list.innerHTML = '<div class="city-item no-result">شهر یافت نشد</div>';
                        return;
                    }

                    data.cities.forEach(city => {
                        const item = document.createElement('div');
                        item.className = 'city-item';
                        item.textContent = `${city.name} (${city.iata})`;
                        item.addEventListener('click', () => {
                            input.value = city.name;
                            hidden.value = city.iata;
                            list.innerHTML = '';
                            list.classList.remove('show');
                        });
                        list.appendChild(item);
                    });
                } catch (err) {
                    console.error('خطا در لود شهرها:', err);
                    list.innerHTML = '<div class="city-item no-result">خطا در بارگذاری شهرها</div>';
                    list.classList.add('show');
                }
            }
        }

        // فعال کردن دراپ‌داون برای همه فیلدهای شهر (پرواز، هتل، تور)
        document.addEventListener('DOMContentLoaded', () => {
            // پرواز
            initCityDropdown('origin-input', 'origin-list', 'origin-iata');
            initCityDropdown('destination-input', 'destination-list', 'destination-iata');

            // هتل
            initCityDropdown('hotel-city-input', 'hotel-city-list', 'hotel-city-iata');

            // تور
            initCityDropdown('tour-origin-input', 'tour-origin-list', 'tour-origin-iata');
            initCityDropdown('tour-destination-input', 'tour-destination-list', 'tour-destination-iata');
        });

        function toggleMenu() {
            const menu = document.getElementById('side-menu');
            const backdrop = document.getElementById('backdrop');
            const icon = document.getElementById('menu-icon');

            menu.classList.toggle('open');
            backdrop.classList.toggle('show');

            if (menu.classList.contains('open')) {
                icon.className = 'fas fa-times';
            } else {
                icon.className = 'fas fa-bars';
            }
        }

        // توابع باز و بسته کردن مودال‌ها
        function openSearchModal(type) {
            document.querySelectorAll('.search-modal').forEach(m => m.classList.remove('show'));
            document.getElementById('modal-backdrop').classList.add('show');
            document.getElementById(type + '-modal').classList.add('show');
        }

        function closeSearchModal(type) {
            document.getElementById(type + '-modal').classList.remove('show');
            document.getElementById('modal-backdrop').classList.remove('show');
        }

        document.getElementById('modal-backdrop').addEventListener('click', function() {
            closeSearchModal('flight');
            closeSearchModal('hotel');
            closeSearchModal('tour');
        });
    </script>
    <script>
        function openSearchModal(type) {
            document.querySelectorAll('.search-modal').forEach(m => m.classList.remove('show'));
            document.getElementById('modal-backdrop').classList.add('show');
            document.getElementById(type + '-modal').classList.add('show');
        }

        function closeSearchModal(type) {
            document.getElementById(type + '-modal').classList.remove('show');
            document.getElementById('modal-backdrop').classList.remove('show');
        }

        document.getElementById('modal-backdrop').addEventListener('click', function() {
            closeSearchModal('flight');
            closeSearchModal('hotel');
            closeSearchModal('tour');
        });
    </script>

</body>
</html>
