{% extends 'base.html' %}
{% block content %}
<h2>ورود به حساب کاربری</h2>
<form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">ارسال کد تایید</button>
</form>
{% if error %}<p style="color:red;">{{ error }}</p>{% endif %}
<p>هنوز حساب ندارید؟ <a href="{% url 'accounts:signup_customer' %}">ثبت‌نام مسافر</a> یا <a href="{% url 'accounts:signup_agency' %}">ثبت‌نام آژانس</a></p>
{% endblock %}
